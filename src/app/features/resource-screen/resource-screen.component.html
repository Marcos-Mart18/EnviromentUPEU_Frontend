<!-- Mostrar cards solo si no hay ruta hija activa -->
<div *ngIf="!isChildRouteActive" class="mx-auto max-w-5xl px-6 py-10">
    <h1 class="text-2xl font-bold text-slate-800">Gestionar Recursos</h1>
    <p class="mt-1 text-sm text-slate-500">Elige qué deseas administrar.</p>
  
    <div class="mt-8 grid gap-6 md:grid-cols-3">
      <article *ngFor="let c of cards"
        class="group cursor-pointer rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:shadow-md"
        (click)="go(c.route)" tabindex="0" (keydown.enter)="go(c.route)" (keydown.space)="go(c.route)">
        <div class="mb-4 inline-flex h-11 w-11 items-center justify-center rounded-xl border"
             [style.borderColor]="brand" [style.background]="'#F3F4E1'">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
               [style.color]="brand" stroke="currentColor">
            <path [attr.d]="c.icon" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-slate-900">{{ c.title }}</h2>
        <p class="mt-2 text-sm text-slate-600">{{ c.desc }}</p>
        <button class="mt-5 inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
                [style.background]="brand">
          {{ c.cta }}
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </article>
    </div>
  </div>
  
  <!-- Router outlet para las rutas hijas -->
  <router-outlet></router-outlet>
