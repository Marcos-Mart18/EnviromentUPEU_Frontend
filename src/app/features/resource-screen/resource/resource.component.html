<div class="mx-auto max-w-5xl px-6 py-8">
  <!-- Botón volver -->
  <button (click)="volver()"
    class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-slate-900">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
    Volver a opciones
  </button>

  <h1 class="text-2xl font-bold text-slate-800 mb-4">Recursos (Resources)</h1>

  <!-- Crear nuevo recurso -->
  <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold mb-3">Crear Recurso</h2>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <input type="text" [(ngModel)]="code" placeholder="Código del recurso"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="number" [(ngModel)]="stock" placeholder="Stock disponible"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="file" (change)="onCreateFileChange($event)" accept="image/*"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <textarea [(ngModel)]="observation" placeholder="Observaciones (opcional)"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm h-20 resize-none"></textarea>
      </div>

      <div class="space-y-3">
        <select [(ngModel)]="idResourceType" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar tipo de recurso</option>
          <option *ngFor="let rt of resourceTypes" [ngValue]="rt.idResourceType">
            {{ rt.name }}
          </option>
        </select>

        <select [(ngModel)]="idState" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar estado</option>
          <option *ngFor="let s of states" [ngValue]="s.idState">
            {{ s.name }}
          </option>
        </select>

        <button (click)="create()" class="w-full rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
          style="background: #bfc621">
          Guardar
        </button>
      </div>
    </div>
  </section>

  <!-- Sección de recursos existentes -->
  <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-semibold">Listado de Recursos</h2>
      <button (click)="showResourcesList = !showResourcesList" class="text-sm text-slate-600">
        {{ showResourcesList ? "Ocultar" : "Mostrar" }} lista
      </button>
    </div>

    <div *ngIf="showResourcesList" class="mt-4">
      <div *ngIf="resources.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let r of resources; let i = index" class="relative rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 hover:shadow-md transition">
          <div class="absolute top-2 left-2 h-6 w-6 rounded-full bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 text-xs font-bold flex items-center justify-center shadow">
            {{ i + 1 }}
          </div>
          <div class="h-56 w-full">
            <ng-container *ngIf="r.resourcePhotoUrl; else noImg">
              <img class="mx-auto h-full w-full rounded-md object-cover" [src]="r.resourcePhotoUrl" alt="Foto del recurso" />
            </ng-container>
            <ng-template #noImg>
              <div class="mx-auto flex h-full w-full items-center justify-center rounded-md bg-gray-100 text-gray-400 dark:bg-gray-700">
                Sin imagen
              </div>
            </ng-template>
          </div>

          <div class="pt-6">
            <div class="mb-4 flex items-center justify-between gap-4">
              <span
                class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wide"
                [ngClass]="
                  ((r.state?.name || '').toLowerCase() === 'disponible')
                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-300'
                    : (['en uso','ocupado','prestado'].includes((r.state?.name || '').toLowerCase()))
                      ? 'bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-300'
                      : (['dañado','inactivo','baja'].includes((r.state?.name || '').toLowerCase()))
                        ? 'bg-rose-100 text-rose-800 dark:bg-rose-900 dark:text-rose-300'
                        : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300'
                "
              >
                {{ r.state?.name ?? '—' }}
              </span>

              <div class="flex items-center justify-end gap-1">
                <button type="button" (click)="edit(r)" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" title="Editar">
                  <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z" />
                  </svg>
                </button>
                <button type="button" (click)="remove(r)" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-red-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" title="Eliminar">
                  <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7m5-4h4m-7 4v12m6-12v12" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="text-lg font-semibold leading-tight text-gray-900 dark:text-white">{{ r.code }}</div>

            <ul class="mt-2 flex flex-wrap items-center gap-4">
              <li class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                <svg class="h-4 w-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18" />
                </svg>
                <span>Stock: <span class="font-medium">{{ r.stock ?? 0 }}</span></span>
              </li>
              <li class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                <svg class="h-4 w-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10v10H7z" />
                </svg>
                <span>Tipo: <span class="font-medium">{{ r.resourceType?.name ?? '—' }}</span></span>
              </li>
            </ul>

            <p *ngIf="r.observation" class="mt-4 text-sm text-gray-600 dark:text-gray-300 line-clamp-2">{{ r.observation }}</p>
          </div>
        </div>
      </div>
      <div *ngIf="resources.length === 0" class="py-3 text-sm text-slate-500">
        No hay recursos registrados.
      </div>
    </div>
  </section>

  <!-- Sección de edición -->
  <section *ngIf="editingId != null" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold mb-3">Editar Recurso</h2>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <input type="text" [(ngModel)]="editingCode" placeholder="Código"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="number" [(ngModel)]="editingStock" placeholder="Stock"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <div *ngIf="editingPhotoUrl" class="flex items-center gap-3">
          <img [src]="editingPhotoUrl" alt="Foto actual" class="h-12 w-12 object-cover rounded" />
          <span class="text-xs text-slate-500">Foto actual</span>
        </div>
        <input type="file" (change)="onEditFileChange($event)" accept="image/*"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <textarea [(ngModel)]="editingObservation" placeholder="Observaciones"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm h-20 resize-none"></textarea>
      </div>

      <div class="space-y-3">
        <select [(ngModel)]="editingIdResourceType" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar tipo de recurso</option>
          <option *ngFor="let rt of resourceTypes" [ngValue]="rt.idResourceType">
            {{ rt.name }}
          </option>
        </select>

        <select [(ngModel)]="editingIdState" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar estado</option>
          <option *ngFor="let s of states" [ngValue]="s.idState">
            {{ s.name }}
          </option>
        </select>

        <div class="flex gap-3">
          <button (click)="save()" class="flex-1 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
            style="background: #60a5fa">
            Guardar cambios
          </button>
          <button (click)="cancel()"
            class="flex-1 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900 bg-slate-200 hover:bg-slate-300">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
