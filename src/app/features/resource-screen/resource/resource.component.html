<div class="mx-auto max-w-5xl px-6 py-8">
  <!-- Botón volver -->
  <button (click)="volver()"
    class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-slate-900">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
    Volver a opciones
  </button>

  <h1 class="text-2xl font-bold text-slate-800 mb-4">Recursos (Resources)</h1>

  <!-- Crear nuevo recurso -->
  <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold mb-3">Crear Recurso</h2>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <input type="text" [(ngModel)]="code" placeholder="Código del recurso"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="number" [(ngModel)]="stock" placeholder="Stock disponible"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="text" [(ngModel)]="resourcePhotoUrl" placeholder="URL de la foto del recurso (opcional)"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <textarea [(ngModel)]="observation" placeholder="Observaciones (opcional)"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm h-20 resize-none"></textarea>
      </div>

      <div class="space-y-3">
        <select [(ngModel)]="idResourceType" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar tipo de recurso</option>
          <option *ngFor="let rt of resourceTypes" [ngValue]="rt.idResourceType">
            {{ rt.name }}
          </option>
        </select>

        <select [(ngModel)]="idState" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar estado</option>
          <option *ngFor="let s of states" [ngValue]="s.idState">
            {{ s.name }}
          </option>
        </select>

        <button (click)="create()" class="w-full rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
          style="background: #bfc621">
          Guardar
        </button>
      </div>
    </div>
  </section>

  <!-- Sección de recursos existentes -->
  <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-semibold">Listado de Recursos</h2>
      <button (click)="showResourcesList = !showResourcesList" class="text-sm text-slate-600">
        {{ showResourcesList ? "Ocultar" : "Mostrar" }} lista
      </button>
    </div>

    <div *ngIf="showResourcesList" class="mt-4">
      <ul class="divide-y divide-slate-100">
        <li *ngFor="let r of resources" class="py-3 flex flex-col sm:flex-row sm:items-start sm:justify-between">
          <div>
            <div class="font-medium">Código: {{ r.code }}</div>
            <div class="text-xs text-slate-500">ID: {{ r.idResource }}</div>
            <div class="text-sm text-slate-600 mt-1">
              Stock: <span class="font-medium">{{ r.stock ?? 0 }}</span>
            </div>
            <div class="text-sm text-slate-600">
              Tipo: {{ r.resourceType?.name ?? '—' }}
            </div>
            <div class="text-sm text-slate-600">
              Estado: {{ r.state?.name ?? '—' }}
            </div>
            <div *ngIf="r.observation" class="text-xs text-slate-500 italic mt-1">
              {{ r.observation }}
            </div>
          </div>

          <div class="flex items-center gap-3 mt-3 sm:mt-0">
            <button (click)="edit(r)" title="Editar" class="text-slate-600 hover:text-emerald-700">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z" />
              </svg>
            </button>
            <button (click)="remove(r)" title="Eliminar" class="text-slate-600 hover:text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-1 12a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7m5-4h4m-7 4v12m6-12v12" />
              </svg>
            </button>
          </div>
        </li>

        <li *ngIf="resources.length === 0" class="py-3 text-sm text-slate-500">
          No hay recursos registrados.
        </li>
      </ul>
    </div>
  </section>

  <!-- Sección de edición -->
  <section *ngIf="editingId != null" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold mb-3">Editar Recurso</h2>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="space-y-3">
        <input type="text" [(ngModel)]="editingCode" placeholder="Código"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="number" [(ngModel)]="editingStock" placeholder="Stock"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <input type="text" [(ngModel)]="editingPhotoUrl" placeholder="URL de la foto"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <textarea [(ngModel)]="editingObservation" placeholder="Observaciones"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm h-20 resize-none"></textarea>
      </div>

      <div class="space-y-3">
        <select [(ngModel)]="editingIdResourceType" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar tipo de recurso</option>
          <option *ngFor="let rt of resourceTypes" [ngValue]="rt.idResourceType">
            {{ rt.name }}
          </option>
        </select>

        <select [(ngModel)]="editingIdState" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">Seleccionar estado</option>
          <option *ngFor="let s of states" [ngValue]="s.idState">
            {{ s.name }}
          </option>
        </select>

        <div class="flex gap-3">
          <button (click)="save()" class="flex-1 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
            style="background: #60a5fa">
            Guardar cambios
          </button>
          <button (click)="cancel()"
            class="flex-1 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900 bg-slate-200 hover:bg-slate-300">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
