    <div
    class="flex flex-col items-center justify-center py-8 mx-auto md:h-screen lg:py-0"
    >
    <div
        class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700"
    >
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1
            class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white"
        >
            Ingresa con tu cuenta
        </h1>

        <!-- Mensaje de error -->
        @if (errorMessage) {
            <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
                {{ errorMessage }}
            </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 md:space-y-6">
            <div>
            <label
                for="username"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Usuario</label
            >
            <input
                type="text"
                formControlName="username"
                id="username"
                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                [class.border-red-500]="username?.invalid && username?.touched"
                placeholder="Ingresa tu usuario"
            />
            @if (username?.invalid && username?.touched) {
                <p class="mt-2 text-sm text-red-600 dark:text-red-500">
                    El usuario es requerido
                </p>
            }
            </div>
            <div>
            <label
                for="password"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Contraseña</label
            >
            <input
                type="password"
                formControlName="password"
                id="password"
                placeholder="••••••••"
                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                [class.border-red-500]="password?.invalid && password?.touched"
            />
            @if (password?.invalid && password?.touched) {
                <p class="mt-2 text-sm text-red-600 dark:text-red-500">
                    La contraseña debe tener al menos 4 caracteres
                </p>
            }
            </div>
            <div class="flex items-center justify-between">
            <div class="flex items-start">
                <div class="flex items-center h-5">
                <input
                    id="remember"
                    formControlName="remember"
                    type="checkbox"
                    class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                />
                </div>
                <div class="ml-3 text-sm">
                <label for="remember" class="text-gray-500 dark:text-gray-300"
                    >Recuérdame</label
                >
                </div>
            </div>
            <a
                href="#"
                class="text-sm font-medium text-[#BFC621] hover:underline dark:text-primary-500"
                >¿Olvidaste tu contraseña?</a
            >
            </div>
            <button
            type="submit"
            [disabled]="isLoading"
            class="cursor-pointer w-full text-white bg-[#BFC621] hover:bg-[#6b9156] focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800 disabled:opacity-50 disabled:cursor-not-allowed"
            >
            @if (isLoading) {
                <span>Cargando...</span>
            } @else {
                <span>Ingresar</span>
            }
            </button>
            <p class="text-sm font-light text-gray-500 dark:text-gray-400">
            ¿No tienes una cuenta?
            <a
                [routerLink]="['/register']"
                class="font-medium text-[#BFC621] hover:underline dark:text-primary-500"
                >Regístrate</a
            >
            </p>
        </form>
        </div>
    </div>
    </div>
