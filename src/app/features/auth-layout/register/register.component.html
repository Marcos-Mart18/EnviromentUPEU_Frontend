        <div
        class="w-full max-w-md bg-white rounded-2xl shadow-md dark:border dark:bg-gray-800 dark:border-gray-700 overflow-hidden"
        >
        <div class="p-6 sm:p-8 md:p-10 space-y-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white text-center">
            Create an account
            </h1>
    
            <form class="space-y-5">
            <!-- Nombre -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
                <input
                id="name"
                type="text"
                placeholder="Marcos"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Apellido -->
            <div>
                <label for="lastname" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last name</label>
                <input
                id="lastname"
                type="text"
                placeholder="Martinez"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last name</label>
                <input
                id="username"
                type="text"
                placeholder="ranita"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Correo -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                <input
                id="email"
                type="email"
                placeholder="name@company.com"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input
                id="password"
                type="password"
                placeholder="••••••••"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Confirmar contraseña -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm password</label>
                <input
                id="confirm-password"
                type="password"
                placeholder="••••••••"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Términos -->
            <div class="flex items-start">
                <input
                id="terms"
                type="checkbox"
                class="mt-1 w-4 h-4 text-[#BFC621] border-gray-300 rounded focus:ring-[#BFC621]"
                required
                />
                <label for="terms" class="ml-2 text-sm text-gray-600 dark:text-gray-300">
                I accept the
                <a href="#" class="text-[#BFC621] hover:underline font-medium">Terms and Conditions</a>
                </label>
            </div>
    
            <!-- Botón -->
            <button
                type="submit"
                class="w-full text-white bg-[#BFC621] hover:bg-[#9ba713] focus:ring-4 focus:outline-none focus:ring-[#e1e673] font-semibold rounded-lg text-sm px-5 py-2.5 transition"
            >
                Create account
            </button>
    
            <!-- Link de login -->
            <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-2">
                Already have an account?
                <a
                routerLink="/login"
                class="text-[#BFC621] font-medium hover:underline"
                >
                Login here
                </a>
            </p>
            </form>
        </div>
        </div>
