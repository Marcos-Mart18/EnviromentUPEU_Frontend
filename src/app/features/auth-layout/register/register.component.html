        <div
        class="w-full max-w-md bg-white rounded-2xl shadow-md dark:border dark:bg-gray-800 dark:border-gray-700 overflow-hidden"
        >
        <div class="p-6 sm:p-8 md:p-10 space-y-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white text-center">
            Crea una cuenta
            </h1>
    
            <form class="space-y-5" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
            <!-- Nombre -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre</label>
                <input
                id="name"
                type="text"
                placeholder="Marcos"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Apellido -->
            <div>
                <label for="lastname" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Apellido Paterno</label>
                <input
                id="lastname"
                type="text"
                placeholder="Martinez"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Apellido Materno</label>
                <input
                id="username"
                type="text"
                placeholder="ranita"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Correo -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Correo Electrónico</label>
                <input
                id="email"
                type="email"
                placeholder="name@company.com"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
                <input
                id="password"
                type="password"
                placeholder="••••••••"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Confirmar contraseña -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirmar contraseña</label>
                <input
                id="confirm-password"
                type="password"
                placeholder="••••••••"
                class="w-full p-2.5 border rounded-lg bg-gray-50 border-gray-300 text-gray-900 text-sm focus:ring-[#BFC621] focus:border-[#BFC621] dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                required
                />
            </div>
    
            <!-- Términos -->
            <div class="flex items-start">
                <input
                id="terms"
                type="checkbox"
                class="mt-1 w-4 h-4 text-[#BFC621] border-gray-300 rounded focus:ring-[#BFC621]"
                required
                />
                <label for="terms" class="ml-2 text-sm text-gray-600 dark:text-gray-300">
                Acepto los
                <a href="#" class="text-[#BFC621] hover:underline font-medium">Términos y Condiciones</a>
                </label>
            </div>
    
            <!-- Botón -->
            <button
                type="submit"
                [disabled]="isSubmitting"
                class="w-full text-white bg-[#BFC621] hover:bg-[#9ba713] focus:ring-4 focus:outline-none focus:ring-[#e1e673] font-semibold rounded-lg text-sm px-5 py-2.5 transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span *ngIf="!isSubmitting">Crear cuenta</span>
                <span *ngIf="isSubmitting" class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Creando cuenta...
                </span>
            </button>
    
            <!-- Link de login -->
            <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-2">
                ¿Ya tienes una cuenta?
                <a
                routerLink="/login"
                class="text-[#BFC621] font-medium hover:underline"
                >
                Ingresar aquí
                </a>
            </p>
            </form>
        </div>
        </div>
