<div class="mx-auto max-w-5xl px-6 py-10">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-2xl font-bold text-slate-800">Gestionar Ambientes</h1>
      <p class="mt-1 text-sm text-slate-500">
        Elige qué deseas crear para continuar.
      </p>
    </header>
  
    <!-- Grid de tarjetas -->
    <div class="grid gap-6 md:grid-cols-2">
      <article
        *ngFor="let card of cards"
        class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:shadow-md focus-within:shadow-md"
        [style.--brand]="brand"
        role="button"
        tabindex="0"
        (click)="go(card.route)"
        (keydown.enter)="go(card.route)"
        (keydown.space)="go(card.route)"
      >
        <!-- Decor superior -->
        <div
          class="pointer-events-none absolute -top-8 -right-8 h-32 w-32 rounded-full opacity-20 transition group-hover:opacity-30"
          [style.backgroundColor]="brand"
        ></div>
  
        <!-- Icono -->
        <div
          class="mb-5 inline-flex h-11 w-11 items-center justify-center rounded-xl"
          [style.backgroundColor]="'#F3F4E1'"
          [style.border]="'1px solid ' + brand"
        >
          <svg
            class="h-6 w-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            [style.color]="brand"
          >
            <path [attr.d]="card.iconPath" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
  
        <!-- Texto -->
        <h2 class="text-lg font-semibold text-slate-900">
          {{ card.title }}
        </h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">
          {{ card.desc }}
        </p>
  
        <!-- CTA -->
        <div class="mt-6">
          <button
            class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm transition hover:brightness-95 active:translate-y-px"
            [style.backgroundColor]="brand"
          >
            {{ card.cta }}
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
  
        <!-- Borde activo al hover/focus -->
        <div
          class="pointer-events-none absolute inset-0 rounded-2xl ring-0 transition group-hover:ring-2 group-focus:ring-2"
          [style.boxShadow]="'0 0 0 2px ' + brand"
          [style.opacity]="0"
        ></div>
      </article>
    </div>
  </div>
