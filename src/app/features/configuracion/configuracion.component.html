<div class="p-6">
  <div class="max-w-4xl mx-auto">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Mi Perfil</h1>
      <p class="text-gray-600">Actualiza tu información personal</p>
    </div>

    <div class="space-y-8">
      <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">Información del Perfil</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombres</label>
            <input type="text" [(ngModel)]="names" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Apellidos</label>
            <input type="text" [(ngModel)]="lastName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico</label>
            <input type="email" [(ngModel)]="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
            <input type="tel" [(ngModel)]="phoneNumber" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
            <input type="text" [(ngModel)]="address" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Nacimiento</label>
            <input type="date" [(ngModel)]="dob" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50">
          </div>
          <div class="flex items-center space-x-2">
            <input id="active" type="checkbox" [(ngModel)]="isActive" class="h-4 w-4">
            <label for="active" class="text-sm text-gray-700">Activo</label>
          </div>
        </div>
        <div class="mt-6">
          <button (click)="save()" class="px-6 py-2 rounded-lg text-white transition-colors duration-200" style="background-color: #BFC621;">
            Guardar Cambios
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">Foto de Perfil</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
          <input type="file" (change)="onPhotoSelected($event)" class="w-full px-3 py-2 border border-gray-300 rounded-lg" />
          <button (click)="uploadPhoto()" class="px-6 py-2 rounded-lg text-white transition-colors duration-200" [class.opacity-50]="!photoFile" [disabled]="!photoFile" style="background-color: #4f46e5;">
            Subir Foto
          </button>
          <div *ngIf="loading" class="text-gray-500">Cargando...</div>
        </div>
      </div>
    </div>
  </div>
</div>
