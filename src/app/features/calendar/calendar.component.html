<div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
  <!-- Calendar Header -->
  <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-6 py-4 border-b border-gray-200">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-900">{{ currentMonth }} {{ currentYear }}</h2>
      <div class="flex items-center space-x-2">
        <button (click)="previousMonth()" class="p-2 hover:bg-gray-200 rounded-lg transition-colors duration-200">
          <svg class="w-4 h-4 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
          </svg>
        </button>
        <button (click)="nextMonth()" class="p-2 hover:bg-gray-200 rounded-lg transition-colors duration-200">
          <svg class="w-4 h-4 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Days of Week Header -->
  <div class="grid grid-cols-7 bg-gray-50 border-b border-gray-200">
    <div class="p-3 text-center text-sm font-medium text-gray-600" *ngFor="let day of daysOfWeek">{{ day }}</div>
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7">
    <div 
      *ngFor="let day of calendarDays" 
      class="min-h-[100px] p-2 border-r border-b border-gray-200 hover:bg-gray-50 transition-colors duration-200"
      [class]="getDayClasses(day)"
    >
      <div class="flex flex-col h-full">
        <!-- Date Number -->
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-medium" [class]="getDateClasses(day)">{{ day.date }}</span>
          <button 
            *ngIf="day.isCurrentMonth" 
            (click)="addEvent(day)"
            class="w-5 h-5 rounded-full hover:bg-gray-200 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200"
          >
            <svg class="w-3 h-3 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>

        <!-- Events -->
        <div class="flex-1 space-y-1">
          <div 
            *ngFor="let event of day.events" 
            class="text-xs px-2 py-1 rounded truncate cursor-pointer hover:opacity-80 transition-opacity duration-200"
            [style.background-color]="event.color"
            [style.color]="getTextColor(event.color)"
            (click)="viewEvent(event)"
          >
            {{ event.title }}
          </div>
          <div 
            *ngIf="day.events.length > 2" 
            class="text-xs text-gray-500 px-2 py-1 cursor-pointer hover:text-gray-700"
            (click)="viewMoreEvents(day)"
          >
            +{{ day.events.length - 2 }} más
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Event Modal -->
<div *ngIf="showEventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" (click)="closeEventModal()">
  <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4" (click)="$event.stopPropagation()">
    <div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Detalles del Evento</h3>
        <button (click)="closeEventModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200">
          <svg class="w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
      <div *ngIf="selectedEvent">
        <div class="mb-4">
          <h4 class="font-medium text-gray-900">{{ selectedEvent.title }}</h4>
          <p class="text-sm text-gray-600">{{ selectedEvent.description }}</p>
        </div>
        <div class="flex items-center space-x-4 text-sm text-gray-500">
          <div class="flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
            </svg>
            {{ selectedEvent.date }}
          </div>
          <div class="flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>
            </svg>
            {{ selectedEvent.time }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
